<!-- Navigation zwischen Sprachen UND Niveaus.
     Die gebaute Seite liegt in docs/<sprache>/<niveau>/..., z. B. docs/de/beg/Qmd Files/...
     Startseite je Sprache: docs/<sprache>/index.html.

     In _quarto-deutsch.yml / _quarto-english.yml stehen nur Platzhalter-Links:
       #sprache-de, #sprache-en          -> dieselbe Seite in der anderen Sprache
       #niveau-beg, #niveau-int, #niveau-exp -> Startseite des Niveaus in der aktuellen Sprache
     Dieses Skript setzt die echten Ziele aus dem aktuellen Pfad ein. Quarto selbst kann
     nicht über Profilgrenzen hinweg verlinken, deshalb braucht es kein Nachbearbeiten der
     HTML-Dateien mehr (früher preview.py: fix_cross_profile_links, fix_navbar_brand_links). -->
<script>
(function () {
  var START = {
    beg: "Qmd Files/Example Page/index_beg.html",
    int: "Qmd Files/Getting Started/getting_started.html",
    exp: "Qmd Files/Tipps and Tricks/index_exp.html"
  };
  var pfad = window.location.pathname;
  // .../<sprache>/<niveau>/... oder .../<sprache>/ (Startseite)
  var m = pfad.match(/^(.*?\/)(de|en|sv|no|da)\/(?:(beg|int|exp)\/)?/);

  function links(anker) {
    // Quarto macht aus "#niveau-beg" einen relativen Link wie "../../#niveau-beg"
    return document.querySelectorAll('a[href$="#' + anker + '"]');
  }
  function aktiv(a) {
    a.classList.add("active");
    a.setAttribute("aria-current", "page");
  }

  if (!m) {
    // quarto preview: nur ein Profil, keine Ordnerstruktur -> Links ohne Wirkung
    ["sprache-de", "sprache-en", "sprache-sv", "sprache-no", "sprache-da", "niveau-beg", "niveau-int", "niveau-exp"].forEach(function (k) {
      links(k).forEach(function (a) {
        a.setAttribute("title", "Nur in der fertig gebauten Seite (python build.py)");
      });
    });
    return;
  }

  var wurzel = m[1];            // alles vor /de/ bzw. /en/ (lokal "/", auf GitHub Pages "/<repo>/")
  var sprache = m[2];
  var niveau = m[3] || null;    // null = Startseite der Sprache
  var basis = wurzel + sprache + "/";

  // Sprache: gleiche Seite, anderes Sprach-Segment
  ["de", "en", "sv", "no", "da"].forEach(function (s) {
    links("sprache-" + s).forEach(function (a) {
      a.setAttribute("href", wurzel + s + "/" + pfad.slice(basis.length) + window.location.search);
      if (s === sprache) aktiv(a);
    });
  });

  // Niveau: Startseite des Niveaus, gleiche Sprache
  Object.keys(START).forEach(function (n) {
    links("niveau-" + n).forEach(function (a) {
      a.setAttribute("href", basis + n + "/" + encodeURI(START[n]));
      if (n === niveau && a.classList.contains("nav-link")) aktiv(a);
    });
  });

  // Titel links oben: immer zur Startseite der Sprache (Quarto kennt nur die Wurzel des Profils)
  document.querySelectorAll("a.navbar-brand").forEach(function (a) {
    a.setAttribute("href", basis);
  });
})();
</script>
